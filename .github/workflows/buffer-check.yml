name: Buffer check

# Rucna kontrola: plati BUFFER_TOKEN a su v nom kanaly z config.example.json? Nic nezverejnuje.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Channels
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, push_to_buffer as pb
          tok = os.environ["BUFFER_TOKEN"]
          want = {c["id"]: c for c in json.load(open("config.example.json"))["buffer_channels"]}
          orgs = pb.gql(tok, "query { account { organizations { id name } } }")["account"]["organizations"]
          print("token OK, organizacie:", [(o["id"], o["name"]) for o in orgs])
          seen = set()
          for o in orgs:
              try:
                  ch = pb.gql(tok, "query($i: ChannelsInput!) { channels(input: $i) { id name service } }",
                              {"i": {"organizationId": o["id"]}})["channels"]
              except Exception as e:
                  print("  org", o["id"], "CHYBA:", str(e)[:200]); continue
              for c in ch:
                  seen.add(c["id"])
                  print(("  [config] " if c["id"] in want else "  ") + c["service"], c["name"], c["id"])
          print("CHYBAJU:", [f'{w["service"]} {w["name"]}' for i, w in want.items() if i not in seen] or "nic")
          PY
