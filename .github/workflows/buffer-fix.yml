name: Buffer fix

# Rucna oprava naplanovaneho dielu: YT video -> URL, chybajuci IG reel dovytvori na rovnaky cas. Nic nemaze.
on:
  workflow_dispatch:
    inputs:
      part:
        description: "Cislo dielu"
        required: true
      url:
        description: "Verejna URL spravneho videa (GitHub Release), alebo 'draft' = YT + IG dielu spat do konceptov"
        required: true
      due:
        description: "Volitelne: koncept/naplanovany diel -> nove video + popisok z part JSON na tento cas (ISO UTC)"
        default: ""

permissions:
  contents: write

concurrency:
  group: vote
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy soundfile
      - name: Fix
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
        run: python vote/tools/buffer_fix.py "${{ inputs.part }}" "${{ inputs.url }}" ${{ inputs.due }}
      - name: Commit pushed.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pushed.json
          git diff --cached --quiet || (git commit -m "vote: Buffer fix part ${{ inputs.part }}" && git push)
